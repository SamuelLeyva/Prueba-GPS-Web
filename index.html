<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo Geolocalizado</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="map"></div>
    
    <button id="user-button" class="floating-control" title="Iniciar Sesión / Registro">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
    </button>

    <button id="gps-button" class="floating-control" title="Centrar en mi ubicación">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 8C9.79 8 8 9.79 8 12s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.1-3.77-7.41-7.87-7.87V2h-1.99v1.13c-4.1.46-7.41 3.77-7.87 7.87H2v1.99h1.13c.46 4.1 3.77 7.41 7.87 7.87V22h1.99v-1.13c4.1-.46 7.41-3.77 7.87-7.87H22v-1.99h-1.06zm-1.81 0h1.81c.08.31.14.63.17.96h-1.91c-.04-.33-.1-.65-.17-.96zm-16.26 0c-.08.31-.14.63-.17.96h1.91c.04-.33.1-.65.17-.96h-1.81zM12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/>
        </svg>
    </button>

    <div id="auth-modal" class="modal">
    
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            
            <div class="auth-tabs">
                <button class="tab-btn active" data-target="login-form">Iniciar Sesión</button>
                <button class="tab-btn" data-target="register-form">Registrarse</button>
            </div>

            <form id="login-form" class="auth-form active">
                <h2>Bienvenido</h2>
                <div class="input-group">
                    <input type="email" name="email" placeholder="Correo electrónico" required>
                </div>
                <div class="input-group">
                    <input type="password" name="password" placeholder="Contraseña" required>
                </div>
                <button type="submit" class="submit-btn">Entrar</button>
            </form>

            <form id="register-form" class="auth-form">
                <h2>Crear Cuenta</h2>
               <div class="input-group relative-container">
                    <input type="text" name="username" id="reg-username" placeholder="Nombre de usuario" autocomplete="off" required>
                    <div id="username-feedback" class="popover-feedback"></div>
                </div>
                <div class="input-group">
                    <input type="email" name="email" placeholder="Correo electrónico" required>
                </div>
                <div class="input-group">
                    <input type="password" name="password" placeholder="Contraseña" required>
                </div>
                <div class="input-group">
                    <input type="password" name="confirm_password" placeholder="Confirmar contraseña" required>
                </div>
                <button type="submit" class="submit-btn register-btn">Registrarse</button>
            </form>
            
            <div id="auth-message"></div>
        </div>
    </div>

    <div id="create-ad-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal close-ad-modal">&times;</span>
            <form id="ad-form" class="auth-form active">
                <h2>Nuevo Anuncio</h2>
                <input type="hidden" name="lat" id="ad-lat">
                <input type="hidden" name="lng" id="ad-lng">

                <div class="input-group">
                    <input type="text" name="title" placeholder="Título (ej: Vendo Bici)" required>
                </div>
                <div class="input-group">
                    <textarea name="description" placeholder="Descripción breve..." rows="3" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-family:sans-serif;" required></textarea>
                </div>
                <div class="input-group">
                    <input type="number" name="price" placeholder="Precio" step="0.01" required>
                </div>
                <button type="submit" class="submit-btn" style="background-color: #EA4335;">Publicar Anuncio</button>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="script.js"></script>
    <div id="profile-view" class="profile-container hidden">
        <div class="profile-header-mobile">
            <button id="close-profile-mobile" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <h2>Mi Perfil</h2>
        </div>

        <div class="profile-content">
            <span class="close-profile-pc">&times;</span>
            <div class="profile-avatar">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ccc" width="80" height="80"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <h3 id="display-username">Usuario</h3>
            <p id="display-email">correo@ejemplo.com</p>
            
            <div class="profile-actions">
                <button class="edit-btn">Editar Datos</button>
                <button id="logout-btn" class="logout-btn">Cerrar Sesión</button>
            </div>
        </div>
    </div>
</body>
</html>
